[package]
name = "rustclipsync-server"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = "0.8"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"

name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Build server for HTTPS interoperability
        run: cargo build --locked
      - name: Check out the verified shared core
        uses: actions/checkout@v5
        with:
          repository: Infinifar/rustclipsync-core
          ref: 5816bb5d18bc38bd26cca1ed6e7c5c093bfacd92
          path: .ci/rustclipsync-core
          persist-credentials: false
      - name: Verify server and shared core over HTTPS
        run: python3 .ci/rustclipsync-core/tests/server_e2e.py "$GITHUB_WORKSPACE/target/debug/rustclipsync-server"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify browser administration in an isolated HTTPS fixture
        env:
          CHROMIUM_BIN: google-chrome
        run: node scripts/admin-browser-test.mjs
      - name: Save administration screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: administration-ui
          path: target/admin-ui/
          if-no-files-found: ignore
